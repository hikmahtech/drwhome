name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # pnpm 11 refuses dependency install scripts (esbuild, biome) unless told otherwise. The
      # lockfile is the trust boundary here.
      - run: pnpm config set dangerouslyAllowAllBuilds true
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - run: pnpm test


  # A job here, not its own workflow: koyracloud deploys when ANY workflow run succeeds, so a
  # separate gitleaks workflow passing could deploy a build whose tests failed.
  secrets-scan:
    # GitHub-hosted on purpose: this repo is public, and a self-hosted runner would run code
    # from any fork's pull request.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks action needs a paid licence for organisation repos; the binary does not.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.22.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan the repo for secrets
        run: gitleaks detect --redact --no-banner --verbose
