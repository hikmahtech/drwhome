name: gitleaks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    # GitHub-hosted on purpose: this repo is public, and a self-hosted runner would run code
    # from any fork's pull request.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks action needs a paid licence for organisation repos; the binary does not.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.22.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan the repo for secrets
        run: gitleaks detect --redact --no-banner --verbose
